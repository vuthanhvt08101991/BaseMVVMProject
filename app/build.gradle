import java.text.SimpleDateFormat

plugins {
    id("com.android.application")
    id("kotlin-android")
    id("kotlin-android-extensions")
    id("kotlin-kapt")
}

apply {
    from("../autodimension.gradle")
}


android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId "com.gmail.thanhva.basemvvmproject"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
//            keyAlias = ""
//            keyPassword = ""
//            storeFile = file("")
//            storePassword = ""
        }

        debug {
            keyAlias = "androiddebugkey"
            keyPassword = "android"
            storeFile = file("../keystore/debug/debug.keystore.jks")
            storePassword = "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            useProguard true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"

//            buildConfigField("String", "API_URL", "\"https://hokuohkurashi.com/api/\"")
        }

        debug{
            applicationIdSuffix ".develop"

            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
            useProguard false
            proguardFiles(getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro")

//            buildConfigField("String", "API_URL", "\"https://mobile.preview.hokuohkurashi.dev/api/\"")
        }
    }

    applicationVariants.all { variant ->
        def USER_NAME_AUTHEN = '"user_name"'
        def PASSWORD_AUTHEN = '"password"'
        buildConfigField("String", "USER_NAME_AUTHEN", "${USER_NAME_AUTHEN}")
        buildConfigField("String", "PASSWORD_AUTHEN", "${PASSWORD_AUTHEN}")
        buildConfigField("String", "API_URL", "\"https://api.themoviedb.org/3\"")

        variant.outputs.all {
            def date = new SimpleDateFormat("yyyyMMdd_HHmm").format(new Date())
            outputFileName = "app-${variant.buildType.name}_${defaultConfig.versionName}_${date}.apk"
        }
    }

    compileOptions {
        setTargetCompatibility(1.8)
        setSourceCompatibility(1.8)
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    dataBinding {
        enabled = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.3.61"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core-ktx:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.3.0-alpha02'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'

    // rx
    implementation("io.reactivex.rxjava2:rxjava:2.2.2")
    implementation("io.reactivex.rxjava2:rxandroid:2.1.0")

    // gson
    implementation("com.google.code.gson:gson:2.8.5")

    // retrofit
    implementation("com.squareup.retrofit2:retrofit:2.5.0")
    implementation("com.squareup.retrofit2:converter-gson:2.5.0")
    implementation("com.squareup.okhttp3:logging-interceptor:3.11.0")
    implementation("com.squareup.retrofit2:adapter-rxjava2:2.5.0")

    // glide
    implementation("com.github.bumptech.glide:glide:4.8.0")
    kapt("com.github.bumptech.glide:compiler:4.8.0")

    // koin
    implementation "org.koin:koin-core:2.1.6"
    implementation "org.koin:koin-core-ext:2.1.6"
    implementation "org.koin:koin-androidx-scope:2.1.6"
    implementation "org.koin:koin-androidx-viewmodel:2.1.6"
    implementation "org.koin:koin-androidx-fragment:2.1.6"


    // unit test
    implementation("org.mockito:mockito-core:2.27.0")
    testImplementation("junit:junit:4.12")
    testImplementation("io.mockk:mockk:1.9.3")
    testImplementation("androidx.arch.core:core-testing:2.1.0-rc01")
    androidTestImplementation("io.mockk:mockk-android:1.9")
    androidTestImplementation("org.koin:koin-test:2.0.0-beta-1")
    testImplementation("org.koin:koin-test:2.0.0-beta-1")
    androidTestImplementation("androidx.arch.core:core-testing:2.0.0")
    androidTestImplementation("androidx.test:core:1.2.0")
    androidTestImplementation("androidx.test:runner:1.2.0")
    androidTestImplementation("androidx.test:rules:1.2.0")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.2.0")
}
